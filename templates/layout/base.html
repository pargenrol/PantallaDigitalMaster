<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />

  <title>{% block title %}RPG Master{% endblock %}</title>

  <link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}">

  <style>
    html, body { margin: 0; padding: 0; }
    img, video { max-width: 100%; height: auto; }
    button, input, select, textarea { font: inherit; }
  </style>

  {% if system is defined and system %}
    {% if system.theme == 'mothership' %}
      <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/mothership.css') }}">
    {% elif system.theme == 'agnostico' %}
      <link rel="stylesheet" href="{{ url_for('static', filename='css/master.css') }}">
      <link rel="stylesheet" href="{{ url_for('static', filename='css/themes/agnostico.css') }}">
    {% else %}
      <link rel="stylesheet" href="{{ url_for('static', filename='css/master.css') }}">
    {% endif %}
  {% else %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/master.css') }}">
  {% endif %}

  {% block head_extra %}{% endblock %}
</head>

<body class="theme-{{ system.theme if system is defined and system else 'dnd5e' }}">
  <main id="app">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
